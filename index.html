<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Najwa Amanda Desyari - Link Page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 340px;
      text-align: center;
    }

    .avatar {
      display: block;
      width: 90px;
      height: 90px;
      margin: 0 auto;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      object-fit: cover;
    }

    h1 { margin-top: 16px; font-size: 1.5rem; }
    .bio { margin-top: 6px; color: #64748b; font-size: 0.9rem; }

    .socials {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
      list-style: none;
    }

    a { color: inherit; text-decoration: none; }

    .socials a {
      display: flex;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
      transition: transform 150ms ease, background 150ms ease;
    }

    .socials a:hover {
      transform: translateY(-3px) scale(1.08);
      background: #e2e8f0;
    }

    h2 {
      margin-top: 32px;
      color: #64748b;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-align: left;
      text-transform: uppercase;
    }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 12px;
      list-style: none;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 20px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #fff;
      font-weight: 600;
      transition: transform 150ms ease, background 150ms ease, color 150ms ease;
    }

    .emoji {
      display: inline-block;
      transition: transform 180ms ease;
    }

    a:hover .emoji,
    a:focus-visible .emoji {
      transform: rotate(-12deg) scale(1.3);
    }

    .links a:hover {
      transform: translateY(-2px);
      background: #0f172a;
      color: #fff;
    }

    a:focus-visible { outline: 2px solid #4f46e5; outline-offset: 3px; }
    footer { margin-top: 36px; color: #94a3b8; font-size: 0.75rem; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <img class="avatar" src="./avatar.svg" alt="Ilustrasi foto profil Najwa Amanda Desyari">
      <h1>Najwa Amanda Desyari</h1>
      <p class="bio">Mahasiswa IT · Belajar web development</p>
    </header>

    <nav aria-label="Media sosial">
      <ul class="socials">
        <li><a href="https://github.com/najwaamandadesyari" aria-label="GitHub"><span class="emoji" aria-hidden="true">🐙</span></a></li>
        <li><a href="https://instagram.com/username" aria-label="Instagram"><span class="emoji" aria-hidden="true">📸</span></a></li>
        <li><a href="https://linkedin.com/in/username" aria-label="LinkedIn"><span class="emoji" aria-hidden="true">💼</span></a></li>
      </ul>
    </nav>

    <section aria-labelledby="my-links">
      <h2 id="my-links">Link Saya</h2>
      <ul class="links">
        <li><a href="https://example.com/portfolio"><span class="emoji" aria-hidden="true">🎨</span> Portofolio</a></li>
        <li><a href="https://github.com/najwaamandadesyari-dot"><span class="emoji" aria-hidden="true">🔗</span> Link Page Ini</a></li>
        <li><a href="https://example.com/catatan"><span class="emoji" aria-hidden="true">📝</span> Catatan Kursus</a></li>
        <li><a href="mailto:najwaamandadesyari@gmail.com"><span class="emoji" aria-hidden="true">✉️</span> Email</a></li>
      </ul>
    </section>

    <footer><p>&copy; 2026 Najwa Amanda Desyari</p></footer>
  </main>
</body>
</html>
