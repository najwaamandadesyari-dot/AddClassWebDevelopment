
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Najwa Amanda - Link Page</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #030817;
    --panel: #111a2b;
    --hover: #1b2740;
    --text: #f4f6fb;
    --muted: #8994aa;
    --purple: #7657ff;
    --border: #202b40;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 36px 24px;
}

a {
    color: inherit;
    text-decoration: none;
}

.page {
    width: 100%;
    max-width: 1080px;
    margin: auto;
    display: grid;
    grid-template-columns: 220px 560px;
    gap: 70px;
    justify-content: center;
    align-items: start;
}

.profile {
    padding-top: 0;
    position: sticky;
    top: 36px;
}

.avatar {
    width: 66px;
    height: 66px;
    border-radius: 50%;
    object-fit: cover;
    background: #7061ed;
    border: 2px solid #9a8cff;
    display: block;
    margin-bottom: 14px;
}

h1 {
    font-size: 20px;
    margin-bottom: 5px;
}

.bio {
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 10px;
}

.social-icons {
    display: flex;
    gap: 8px;
}

.social-icons a {
    width: 27px;
    height: 27px;
    display: grid;
    place-items: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 50%;
    font-size: 13px;
}

.section-title {
    color: #9ba5b9;
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 9px;
    font-weight: bold;
}

.tabs {
    display: flex;
    gap: 5px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}

.tab {
    border: 1px solid var(--border);
    background: var(--panel);
    color: #d3d8e4;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 10px;
    cursor: pointer;
}

.tab.active {
    background: var(--purple);
    border-color: var(--purple);
    color: white;
}

.hint {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 7px;
}

.links {
    display: grid;
    gap: 5px;
    list-style: none;
}

.links li[hidden] {
    display: none;
}

.links a,
.link-disabled {
    min-height: 34px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 10px;
    font-weight: 600;
    transition: 0.2s;
}

.links a:hover {
    background: var(--hover);
    border-color: #46516a;
    transform: translateY(-1px);
}

.link-disabled {
    color: #a0a9ba;
}

.emoji {
    font-size: 11px;
}

.add-section {
    margin-top: 23px;
}

.add-form {
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 9px;
    display: grid;
    gap: 9px;
}

.field {
    display: grid;
    gap: 5px;
}

.field label {
    font-size: 9px;
    color: #dce1eb;
}

.field input,
.field select {
    width: 100%;
    height: 31px;
    border: 1px solid #273249;
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    padding: 7px 9px;
    font-size: 10px;
    outline: none;
}

.field input:focus,
.field select:focus {
    border-color: var(--purple);
}

.field input::placeholder {
    color: #657087;
}

.add-button {
    border: none;
    background: var(--purple);
    color: white;
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
}

.add-button:hover {
    background: #6543f5;
}

footer {
    margin-top: 22px;
    color: #667187;
    font-size: 10px;
}

@media (max-width: 700px) {
    body {
        padding: 28px 18px;
    }

    .page {
        grid-template-columns: 1fr;
        gap: 28px;
        max-width: 420px;
    }

    .profile {
        position: static;
        text-align: center;
    }

    .avatar {
        margin: 0 auto 12px;
    }

    .social-icons {
        justify-content: center;
    }

    h1 {
        font-size: 21px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        transition: none !important;
    }
}
</style>
</head>

<body>

<main class="page">

    <!-- PROFIL SEBELAH KIRI -->
    <aside class="profile">
        <header>
            <img class="avatar" src="foto%20Najwa%20Amanda%20Unsiq.jpeg"
                 alt="Foto Najwa Amanda Desyari">

            <h1>Najwa Amanda Desyari</h1>
            <p class="bio">Mahasiswa IT · Belajar web development</p>

            <nav class="social-icons">
                <a href="https://github.com/najwaamandadesyari-dot"
                   target="_blank" aria-label="GitHub">🐙</a>

                <a href="https://www.instagram.com/najwaamandsy"
                   target="_blank" aria-label="Instagram">📸</a>

                <a href="mailto:najwaamandadesyari@gmail.com"
                   aria-label="Email">✉️</a>
            </nav>
        </header>
    </aside>

    <!-- KONTEN SEBELAH KANAN -->
    <section class="content">

        <h2 class="section-title">Link Saya</h2>

        <!-- FILTER KATEGORI -->
        <nav class="tabs">
            <button class="tab active" data-filter="semua">
                Semua
            </button>

            <button class="tab" data-filter="sosmed">
                Sosmed
            </button>

            <button class="tab" data-filter="project">
                Project
            </button>

            <button class="tab" data-filter="kontak">
                Kontak
            </button>
        </nav>

        <p class="hint">Menampilkan 8 link</p>

        <!-- DAFTAR LINK -->
        <ul class="links" id="link-list">

            <li data-category="sosmed">
                <a href="https://github.com/najwaamandadesyari-dot"
                   target="_blank" rel="noopener noreferrer">
                    <span class="emoji">🐙</span> GitHub
                </a>
            </li>

            <li data-category="sosmed">
                <a href="https://www.instagram.com/najwaamandsy"
                   target="_blank" rel="noopener noreferrer">
                    <span class="emoji">📸</span> Instagram
                </a>
            </li>

            <li data-category="sosmed">
                <div class="link-disabled">
                    <span class="emoji">💼</span> LinkedIn
                </div>
            </li>

            <li data-category="project">
                <a href="https://example.com/portfolio"
                   target="_blank" rel="noopener noreferrer">
                    <span class="emoji">🎨</span> Portofolio
                </a>
            </li>

            <li data-category="project">
                <a href="https://github.com/najwaamandadesyari-dot"
                   target="_blank" rel="noopener noreferrer">
                    <span class="emoji">🧩</span>
                    Link Page Ini (Repo)
                </a>
            </li>

            <li data-category="project">
                <a href="https://example.com/catatan"
                   target="_blank" rel="noopener noreferrer">
                    <span class="emoji">📒</span> Catatan Kursus
                </a>
            </li>

            <li data-category="kontak">
                <a href="mailto:najwaamandadesyari@gmail.com">
                    <span class="emoji">✉️</span> Email
                </a>
            </li>

            <li data-category="kontak">
                <a href="https://wa.me/"
                   target="_blank" rel="noopener noreferrer">
                    <span class="emoji">💬</span> WhatsApp
                </a>
            </li>

        </ul>

        <!-- FORM TAMBAH LINK -->
        <section class="add-section">
            <h2 class="section-title">Tambah Link</h2>

            <form class="add-form" id="add-link-form">

                <div class="field">
                    <label for="link-title">Judul</label>
                    <input
                        id="link-title"
                        type="text"
                        placeholder="Contoh: Website saya"
                        required
                    >
                </div>

                <div class="field">
                    <label for="link-url">URL</label>
                    <input
                        id="link-url"
                        type="url"
                        placeholder="https://..."
                        required
                    >
                </div>

                <div class="field">
                    <label for="link-category">Kategori</label>
                    <select id="link-category">
                        <option value="sosmed">Sosmed</option>
                        <option value="project">Project</option>
                        <option value="kontak">Kontak</option>
                    </select>
                </div>

                <button class="add-button" type="submit">
                    + Tambahkan Link
                </button>

            </form>
        </section>

        <footer>
            <p>&copy; 2026 Najwa Amanda Desyari</p>
        </footer>

    </section>

</main>

<script>
// FILTER LINK
const tabs = document.querySelectorAll(".tab");
const linkList = document.getElementById("link-list");
const hint = document.querySelector(".hint");

function applyFilter(filter) {
    let count = 0;

    linkList.querySelectorAll("li").forEach(item => {
        const visible =
            filter === "semua" ||
            item.dataset.category === filter;

        item.hidden = !visible;

        if (visible) {
            count++;
        }
    });

    hint.textContent = `Menampilkan ${count} link`;

    tabs.forEach(tab => {
        tab.classList.toggle(
            "active",
            tab.dataset.filter === filter
        );
    });
}

tabs.forEach(tab => {
    tab.addEventListener("click", () => {
        applyFilter(tab.dataset.filter);
    });
});

// TAMBAH LINK BARU
document.getElementById("add-link-form")
.addEventListener("submit", function(event) {
    event.preventDefault();

    const title = document.getElementById("link-title")
        .value.trim();

    const url = document.getElementById("link-url")
        .value.trim();

    const category = document.getElementById("link-category")
        .value;

    if (!title || !url) {
        return;
    }

    let safeUrl = url;

    if (
        !/^https?:\/\//i.test(safeUrl) &&
        !/^mailto:/i.test(safeUrl)
    ) {
        safeUrl = "https://" + safeUrl;
    }

    const li = document.createElement("li");
    li.dataset.category = category;

    const a = document.createElement("a");
    a.href = safeUrl;
    a.target = "_blank";
    a.rel = "noopener noreferrer";

    const icon = document.createElement("span");
    icon.className = "emoji";

    icon.textContent =
        category === "sosmed" ? "📱" :
        category === "project" ? "🧩" : "🔗";

    a.append(icon, document.createTextNode(" " + title));
    li.appendChild(a);
    linkList.appendChild(li);

    this.reset();

    // Tampilkan kategori link yang baru ditambahkan
    applyFilter(category);
});
</script>

</body>
</html>
